# Example: ESP32-S3 Piglet master / mesh Core with optional feedback
board=s3
deviceRole=master
meshModeOnBoot=core
scanMode=aggressive

ws2811Enable=true
ws2811Pin=1
ws2811Brightness=64

buzzerEnable=true
buzzerPin=3
buzzerType=active
buzzerVolume=128
buzzerStartupTone=false
alertGpsFix=true
alertNodeDisconnect=true

autoUpdateHeadlessNodes=false
